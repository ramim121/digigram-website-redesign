# new.digigramventures.com
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/new.digigramventures.com
#   sudo ln -s /etc/nginx/sites-available/new.digigramventures.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d new.digigramventures.com
#
# Point an A record at the EC2 elastic IP BEFORE running certbot — it validates
# over HTTP and fails if the name does not resolve yet.

server {
    listen 80;
    listen [::]:80;
    server_name new.digigramventures.com;

    # Certbot rewrites this block to redirect to 443 and adds the TLS server
    # block below it. Leave the ACME path reachable over plain HTTP so renewals
    # keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;

        # Next reads these to build absolute URLs and to know the request was
        # HTTPS. Without X-Forwarded-Proto it generates http:// links behind
        # the proxy, which browsers then block as mixed content.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server components stream their response. Buffering holds the whole
        # thing back and throws away the benefit.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Immutable build assets — the filename changes whenever the content does,
    # so they can be cached hard. Everything else is dynamic and must not be.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads are not served from here; the API and S3 handle those.
    client_max_body_size 2m;
}
